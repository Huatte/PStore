<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员 · PStore</title>
  <link rel="stylesheet" href="/css/style.css?v=32" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">PStore</a>
      <span class="tagline">管理面板</span>
    </div>
  </header>

  <main class="wrap">
    <!-- login gate -->
    <section id="login-view" class="card">
      <h2>管理员登录</h2>
      <input id="admin-pass" type="password" placeholder="管理密码" />
      <button id="login-btn">登录</button>
      <div id="login-msg" class="msg"></div>
    </section>

    <!-- admin panel -->
    <section id="panel-view" class="hidden">
      <nav class="tabs">
        <button class="tab active" data-tab="upload">上传图片</button>
        <button class="tab" data-tab="image-review">图片审核</button>
        <button class="tab" data-tab="moderate">留言审核</button>
        <button class="tab" data-tab="manage">管理图片</button>
        <button class="tab" data-tab="groups">合集管理</button>
        <button id="logout-btn" class="logout">退出</button>
      </nav>

      <!-- upload tab -->
      <div class="tab-panel" id="tab-upload">
        <div class="card">
          <h3>上传图片</h3>
          <input id="file-input" type="file" accept="image/*" multiple />
          <div class="upload-mode">
            <label><input type="radio" name="admin-upload-mode" value="separate" checked /> 每张单独详情页</label>
            <label><input type="radio" name="admin-upload-mode" value="merge" /> 合并到同一详情页</label>
          </div>
          <input id="admin-upload-group-name" type="text" placeholder="合集名称（合并模式必填）" maxlength="60" style="display:none" />
          <button id="upload-btn">上传</button>
          <button id="admin-retry-failed" class="btn-retry hidden" style="display:none">重试失败的上传</button>
          <div id="upload-progress" class="msg"></div>
          <div id="upload-results" class="upload-list"></div>
        </div>
      </div>

      <!-- image review tab -->
      <div class="tab-panel hidden" id="tab-image-review">
        <div class="card">
          <h3>图片审核 <span id="image-pending-count" class="badge"></span></h3>
          <div class="bulk-bar">
            <label class="bulk-check"><input type="checkbox" id="review-select-all" /> 全选</label>
            <button id="review-bulk-approve" class="btn-bulk-ok">批量通过</button>
            <button id="review-bulk-reject" class="btn-bulk-bad">批量拒绝</button>
          </div>
          <div id="image-review-list" class="comment-list"></div>
        </div>
      </div>

      <!-- moderate tab -->
      <div class="tab-panel hidden" id="tab-moderate">
        <div class="card">
          <h3>留言管理</h3>
          <div class="search-bar">
            <input id="moderate-search" type="text" placeholder="搜索留言ID、内容或昵称…" autocomplete="off" />
          </div>
          <div id="moderate-list" class="comment-list"></div>
          <div class="pager">
            <button id="moderate-prev" class="btn-pager">上一页</button>
            <span id="moderate-info" class="pager-info"></span>
            <button id="moderate-next" class="btn-pager">下一页</button>
          </div>
        </div>
      </div>

      <!-- manage tab -->
      <div class="tab-panel hidden" id="tab-manage">
        <div class="card">
          <h3>图片管理</h3>
          <div class="search-bar">
            <input id="manage-search" type="text" placeholder="搜索图片名称…" autocomplete="off" />
          </div>
          <div class="bulk-bar">
            <label class="bulk-check"><input type="checkbox" id="manage-select-all" /> 全选</label>
            <button id="manage-bulk-download" class="btn-bulk-ok">批量下载</button>
            <button id="manage-bulk-delete" class="btn-bulk-bad">批量删除</button>
          </div>
          <div id="manage-list" class="gallery small"></div>
        </div>
      </div>

      <!-- groups tab -->
      <div class="tab-panel hidden" id="tab-groups">
        <div class="card">
          <h3>合集管理</h3>
          <div class="bulk-bar">
            <button id="group-create-btn" class="btn-bulk-ok">新建合集</button>
          </div>
          <div id="group-list"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- image picker modal for adding to groups -->
  <div id="group-picker-modal" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h3>选择图片加入合集</h3>
        <button id="group-picker-close" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <input id="group-picker-search" type="text" placeholder="搜索图片名称…" autocomplete="off" />
        <div class="picker-filters">
          <label class="bulk-check"><input type="checkbox" id="picker-ungrouped" /> 仅未加入合集的图片</label>
          <select id="picker-time">
            <option value="">全部时间</option>
            <option value="today">今天</option>
            <option value="7d">7天内</option>
            <option value="30d">30天内</option>
          </select>
        </div>
        <div id="group-picker-grid" class="gallery small"></div>
        <div class="group-picker-footer">
          <span id="group-picker-count">已选 0 张</span>
          <button id="group-picker-confirm" class="btn-bulk-ok">确认添加</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/admin.js?v=32"></script>
</body>
</html>
