<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片 · PStore</title>
  <link rel="stylesheet" href="/css/style.css?v=32" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">PStore</a>
      <a class="admin-link" href="/nb">管理</a>
    </div>
  </header>

  <main class="wrap">
    <div class="back"><a href="/">&larr; 返回图库</a></div>
    <section class="detail">
      <div class="group-title" id="group-title"></div>
      <div class="detail-img" id="detail-imgs"></div>
      <div class="detail-meta" id="meta"></div>

      <div class="comments">
        <h3>留言</h3>
        <div id="comment-list" class="comment-list"></div>
        <form id="comment-form" class="comment-form">
          <input id="c-author" placeholder="昵称" maxlength="40" required />
          <textarea id="c-text" placeholder="留下你的评论…" maxlength="500" required></textarea>
          <button type="submit">提交</button>
          <div class="hint">欢迎留言交流</div>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/image.js?v=32"></script>
</body>
</html>
