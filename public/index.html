<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PStore · 图片存储</title>
  <link rel="stylesheet" href="/css/style.css?v=4" />
</head>
<body>

      <span class="header-actions">
        <button id="upload-open" class="upload-link">上传</button>
        <a class="admin-link" href="/nb">管理</a>
      </span>
    </div>
  </header>

  <main class="wrap">
    <div class="search-bar">
      <input id="search-box" type="text" placeholder="搜索图片名称�? autocomplete="off" />
    </div>
    <div id="gallery" class="gallery">
      <div class="empty">加载中�?/div>
    </div>
  </main>

  <!-- user upload modal -->
  <div id="upload-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>上传图片</h3>
        <button id="upload-close" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <input id="upload-file" type="file" accept="image/*" />
        <input id="upload-nickname" type="text" placeholder="你的昵称（可选，最�?0字）" maxlength="30" />
        <button id="upload-submit">提交审核</button>
        <div id="upload-msg" class="msg"></div>
        <div class="hint">上传后需管理员审核通过才会公开展示。支�?png/jpg/gif/webp/bmp/avif，最�?40MB�?/div>
      </div>
    </div>
  </div>

  <script src="/js/app.js?v=4"></script>
</body>
</html>
