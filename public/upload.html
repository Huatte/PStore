<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上传图片 · PStore</title>
  <link rel="stylesheet" href="/css/style.css?v=25" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">PStore</a>
      <span class="header-actions">
        <a class="admin-link" href="/nb">管理</a>
      </span>
    </div>
  </header>

  <main class="wrap">
    <div class="back"><a href="/">&larr; 返回图库</a></div>
    <section class="card upload-page-card">
      <h2>上传图片</h2>
      <div class="upload-page-form">
        <input id="upload-file" type="file" accept="image/*" multiple />
        <input id="upload-nickname" type="text" placeholder="昵称（必填，最长30字）" maxlength="30" required />
        <div class="upload-mode">
          <label><input type="radio" name="upload-mode" value="separate" checked /> 每张单独详情页</label>
          <label><input type="radio" name="upload-mode" value="merge" /> 合并到同一详情页</label>
        </div>
        <div class="upload-page-actions">
          <button id="upload-submit">提交审核</button>
          <button id="retry-failed" class="btn-retry hidden" style="display:none">重试失败的上传</button>
        </div>
        <div id="upload-msg" class="msg"></div>
        <div id="upload-list" class="upload-list"></div>
        <div class="hint">支持一次选多张。选择"合并到同一详情页"后，多张图会在一个页面里依次展示。上传后需管理员审核。支持 png/jpg/gif/webp/bmp/avif，最大 40MB。</div>
      </div>
    </section>
  </main>

  <script src="/js/upload.js?v=25"></script>
</body>
</html>
